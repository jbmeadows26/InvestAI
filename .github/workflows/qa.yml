name: Source QA
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 22 * * 1-5'
    - cron: '19 15 * * 0'
permissions:
  contents: read
concurrency:
  group: investai-qa
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - run: python engine.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-qa
          path: data/*.json
          retention-days: 14
          if-no-files-found: warn
