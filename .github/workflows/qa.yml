name: Source QA and dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 22 * * 1-5'
    - cron: '19 15 * * 0'
permissions:
  contents: read
concurrency:
  group: investai-qa
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Collect and validate
        id: collect
        continue-on-error: true
        run: python engine.py > /tmp/investai-private.log
      - name: Export public audit (no research predictions)
        if: always()
        run: python publish_report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-qa
          path: site/latest.json
          retention-days: 14
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with:
          path: site
      - name: Fail audit on unsuccessful collection
        if: steps.collect.outcome != 'success'
        run: exit 1
  deploy:
    needs: audit
    if: always() && (needs.audit.result == 'success' || needs.audit.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
